# Railway deploy for repos that run multiple services (e.g. web + worker).
#
# Setup:
#   1. Create a project token: Railway dashboard → Project → Settings → Tokens
#   2. Add it as a GitHub repository secret named RAILWAY_TOKEN
#   3. Copy this file to .github/workflows/deploy.yml in your repo
#   4. Edit the service names in the deploy steps below

name: Deploy to Railway (multi-service)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build railguey
        run: |
          git clone --depth 1 https://github.com/eidos-agi/railguey.git "$RUNNER_TEMP/railguey-source"
          go build -C "$RUNNER_TEMP/railguey-source" -o "$RUNNER_TEMP/railguey" ./cmd/railguey

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ matrix.service }}
        run: >-
          "$RUNNER_TEMP/railguey" upload-source "$GITHUB_WORKSPACE" "$RAILWAY_SERVICE" --message "$GITHUB_SHA"
